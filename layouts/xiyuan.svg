<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200">
  <!-- xiyuan: Flexoki light. Sidebar (spaces + folder menu, agents), terminal, Changes panel with git actions. -->
  <rect width="320" height="200" fill="#F2F0E5"/>

  <!-- sidebar -->
  <rect width="64" height="200" fill="#F2F0E5"/>
  <rect x="6" y="6" width="22" height="4" rx="2" fill="#100F0F"/>
  <rect x="6" y="20" width="16" height="2.5" rx="1" fill="#B7B5AC"/>
  <!-- folder button (pressed) and + -->
  <rect x="42" y="16" width="9" height="9" rx="2" fill="#E6E4D9"/>
  <path d="M44 19h2l1 1h2.5v3.5h-5.5z" fill="none" stroke="#100F0F" stroke-width="0.8" stroke-linejoin="round"/>
  <path d="M55.5 18.5v5M53 21h5" stroke="#6F6E69" stroke-width="0.8" stroke-linecap="round"/>
  <!-- spaces -->
  <rect x="4" y="29" width="56" height="11" rx="2.5" fill="#E6E4D9"/>
  <rect x="7" y="32" width="5" height="5" rx="1.2" fill="#3AA99F"/><rect x="15" y="33" width="26" height="3" rx="1" fill="#100F0F"/>
  <rect x="7" y="44" width="5" height="5" rx="1.2" fill="#D0A215"/><rect x="15" y="45" width="20" height="3" rx="1" fill="#6F6E69"/>
  <rect x="7" y="56" width="5" height="5" rx="1.2" fill="#4385BE"/><rect x="15" y="57" width="23" height="3" rx="1" fill="#6F6E69"/>
  <!-- agents -->
  <rect x="6" y="106" width="16" height="2.5" rx="1" fill="#B7B5AC"/>
  <circle cx="9" cy="118" r="2" fill="#D0A215"/><rect x="15" y="116.5" width="30" height="3" rx="1" fill="#6F6E69"/>
  <circle cx="9" cy="129" r="2" fill="#879A39"/><rect x="15" y="127.5" width="24" height="3" rx="1" fill="#6F6E69"/>
  <rect x="6" y="182" width="40" height="3" rx="1" fill="#B7B5AC"/>
  <rect x="64" width="1" height="200" fill="#DAD8CE"/>

  <!-- tabs -->
  <rect x="65" width="255" height="14" fill="#F2F0E5"/>
  <rect x="69" y="3" width="34" height="9" rx="2.5" fill="#FFFCF0" stroke="#DAD8CE" stroke-width="0.5"/>
  <rect x="73" y="6.5" width="22" height="2.5" rx="1" fill="#100F0F"/>
  <rect x="109" y="6.5" width="20" height="2.5" rx="1" fill="#B7B5AC"/>
  <rect x="290" y="5" width="24" height="5" rx="1.5" fill="#E6E4D9"/>

  <!-- terminal -->
  <rect x="68" y="16" width="166" height="170" rx="4" fill="#FFFCF0" stroke="#205EA6" stroke-width="0.8"/>
  <g fill="#6F6E69">
    <rect x="76" y="24" width="8" height="2.5" rx="1" fill="#879A39"/><rect x="87" y="24" width="50" height="2.5" rx="1" fill="#100F0F"/>
    <rect x="76" y="31" width="90" height="2.5" rx="1"/>
    <rect x="76" y="38" width="72" height="2.5" rx="1"/>
    <rect x="76" y="45" width="104" height="2.5" rx="1"/>
    <rect x="76" y="56" width="8" height="2.5" rx="1" fill="#879A39"/><rect x="87" y="56" width="38" height="2.5" rx="1" fill="#100F0F"/>
    <rect x="76" y="63" width="60" height="2.5" rx="1" fill="#205EA6"/>
    <rect x="76" y="70" width="84" height="2.5" rx="1"/>
    <rect x="76" y="81" width="8" height="2.5" rx="1" fill="#879A39"/><rect x="87" y="80.5" width="3" height="4" fill="#100F0F"/>
  </g>

  <!-- changes panel -->
  <rect x="237" y="14" width="1" height="174" fill="#DAD8CE"/>
  <rect x="238" y="14" width="82" height="174" fill="#FFFCF0"/>
  <rect x="242" y="19" width="22" height="3" rx="1" fill="#100F0F"/>
  <!-- branch bar: name ↑1, Fetch / Pull / Push -->
  <rect x="242" y="27" width="16" height="2.5" rx="1" fill="#6F6E69"/><rect x="260" y="27" width="5" height="2.5" rx="1" fill="#879A39"/>
  <rect x="270" y="25" width="13" height="6" rx="1.5" fill="none" stroke="#DAD8CE" stroke-width="0.6"/>
  <rect x="285" y="25" width="13" height="6" rx="1.5" fill="none" stroke="#DAD8CE" stroke-width="0.6"/>
  <rect x="300" y="25" width="15" height="6" rx="1.5" fill="none" stroke="#DAD8CE" stroke-width="0.6"/>
  <!-- files with stage boxes -->
  <g stroke-width="0.6">
    <rect x="242" y="37" width="4" height="4" rx="0.8" fill="#205EA6" stroke="#205EA6"/>
    <rect x="242" y="45" width="4" height="4" rx="0.8" fill="#205EA6" stroke="#205EA6"/>
    <rect x="242" y="53" width="4" height="4" rx="0.8" fill="none" stroke="#B7B5AC"/>
  </g>
  <rect x="249" y="37.5" width="3" height="3" rx="0.6" fill="#D0A215"/><rect x="255" y="38" width="34" height="2.5" rx="1" fill="#100F0F"/>
  <rect x="249" y="45.5" width="3" height="3" rx="0.6" fill="#879A39"/><rect x="255" y="46" width="28" height="2.5" rx="1" fill="#100F0F"/>
  <rect x="249" y="53.5" width="3" height="3" rx="0.6" fill="#D14D41"/><rect x="255" y="54" width="40" height="2.5" rx="1" fill="#6F6E69"/>
  <!-- diff -->
  <rect x="242" y="64" width="74" height="6" fill="#D14D41" opacity="0.12"/><rect x="244" y="65.8" width="50" height="2.2" rx="1" fill="#D14D41"/>
  <rect x="242" y="71" width="74" height="6" fill="#879A39" opacity="0.15"/><rect x="244" y="72.8" width="58" height="2.2" rx="1" fill="#879A39"/>
  <rect x="244" y="80" width="44" height="2.2" rx="1" fill="#B7B5AC"/>
  <!-- commit box and buttons -->
  <rect x="242" y="160" width="74" height="9" rx="2.5" fill="none" stroke="#205EA6" stroke-width="0.6"/>
  <rect x="245" y="163.5" width="30" height="2" rx="1" fill="#B7B5AC"/>
  <rect x="270" y="174" width="26" height="7" rx="1.5" fill="none" stroke="#DAD8CE" stroke-width="0.6"/>
  <rect x="298" y="174" width="18" height="7" rx="1.5" fill="#100F0F"/>

  <!-- status bar -->
  <rect x="65" y="188" width="255" height="12" fill="#F2F0E5"/>
  <rect x="70" y="192.5" width="30" height="2.5" rx="1" fill="#B7B5AC"/>

  <!-- folder menu dropped down from the folder button -->
  <g>
    <rect x="44" y="27" width="86" height="100" rx="4" fill="#000000" opacity="0.08" transform="translate(1 2)"/>
    <rect x="44" y="27" width="86" height="100" rx="4" fill="#FFFCF0" stroke="#DAD8CE" stroke-width="0.6"/>
    <rect x="49" y="32" width="40" height="2.5" rx="1" fill="#6F6E69"/>
    <g font-family="sans-serif" font-size="5" font-weight="600" text-anchor="middle">
      <rect x="47" y="38" width="80" height="9" rx="2" fill="#E6E4D9"/>
      <rect x="49" y="39.5" width="6" height="6" rx="1.2" fill="none" stroke="#205EA6" stroke-width="0.6"/><text x="52" y="44.3" fill="#205EA6">1</text>
      <rect x="58" y="41.5" width="22" height="2.5" rx="1" fill="#100F0F"/><rect x="83" y="41.5" width="30" height="2.5" rx="1" fill="#B7B5AC"/>
      <rect x="49" y="49.5" width="6" height="6" rx="1.2" fill="none" stroke="#205EA6" stroke-width="0.6"/><text x="52" y="54.3" fill="#205EA6">2</text>
      <rect x="58" y="51.5" width="18" height="2.5" rx="1" fill="#100F0F"/><rect x="79" y="51.5" width="34" height="2.5" rx="1" fill="#B7B5AC"/>
      <rect x="49" y="59.5" width="6" height="6" rx="1.2" fill="none" stroke="#205EA6" stroke-width="0.6"/><text x="52" y="64.3" fill="#205EA6">3</text>
      <rect x="58" y="61.5" width="26" height="2.5" rx="1" fill="#100F0F"/><rect x="87" y="61.5" width="24" height="2.5" rx="1" fill="#B7B5AC"/>
      <rect x="49" y="69.5" width="6" height="6" rx="1.2" fill="none" stroke="#B7B5AC" stroke-width="0.6"/><text x="52" y="74.3" fill="#B7B5AC">4</text>
      <rect x="58" y="71.5" width="34" height="2.5" rx="1" fill="#CECDC3"/>
      <rect x="49" y="79.5" width="6" height="6" rx="1.2" fill="none" stroke="#B7B5AC" stroke-width="0.6"/><text x="52" y="84.3" fill="#B7B5AC">5</text>
      <rect x="58" y="81.5" width="34" height="2.5" rx="1" fill="#CECDC3"/>
      <rect x="49" y="89.5" width="6" height="6" rx="1.2" fill="none" stroke="#B7B5AC" stroke-width="0.6"/><text x="52" y="94.3" fill="#B7B5AC">6</text>
      <rect x="58" y="91.5" width="34" height="2.5" rx="1" fill="#CECDC3"/>
      <rect x="49" y="99.5" width="6" height="6" rx="1.2" fill="none" stroke="#B7B5AC" stroke-width="0.6"/><text x="52" y="104.3" fill="#B7B5AC">7</text>
      <rect x="58" y="101.5" width="34" height="2.5" rx="1" fill="#CECDC3"/>
    </g>
    <rect x="47" y="111" width="80" height="0.6" fill="#DAD8CE"/>
    <rect x="50" y="116.5" width="22" height="2.5" rx="1" fill="#100F0F"/><rect x="112" y="116.5" width="12" height="2.5" rx="1" fill="#B7B5AC"/>
  </g>
</svg>
